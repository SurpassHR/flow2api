# flow2api 公共代理逻辑（由 flow_server 的 80/443 server 块共同 include）
# 注意：本文件只能在 server 块内 include——顶部的 real_ip 指令若进入 http 作用域，
# 会与 grok2api_server 的同类声明冲突（real_ip_header 每个上下文仅能声明一次）

# 还原 Cloudflare 边缘传递的客户端真实 IP
include snippets/cloudflare-real-ip.conf;

location /metrics {
    # Prometheus 指标含内部运行信息，仅允许本机抓取
    allow 127.0.0.1;
    allow ::1;
    deny all;

    proxy_pass http://127.0.0.1:38000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location / {
    proxy_pass http://127.0.0.1:38000;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # 强制 https：用户侧协议由 Cloudflare 终结，源站一律按 https 看待。
    # 不能透传 $http_x_forwarded_proto——CF Flexible 模式回源走 80 端口，
    # 该头恒为 http，会导致应用把图片/媒体 URL 生成为 http:// 链接，
    # 客户端访问 http:// 再被 301 → CF 缓存坏 301 → 死循环无法打开。
    proxy_set_header X-Forwarded-Proto https;

    # 支持 WebSocket
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # SSE 流式响应：关闭缓冲，保证流式生成实时输出
    proxy_buffering off;

    # 视频/图片生成耗时较长，防止网关 504
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;
}
